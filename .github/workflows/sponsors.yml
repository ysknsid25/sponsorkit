name: Update Sponsors

on:
  schedule:
    # 毎日 03:00 JST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sponsorkit.config.mjs'
      - '.github/workflows/sponsors.yml'

# Pages へのデプロイは同時に1つだけ。実行中のものはキャンセルせず完了させる
concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate sponsor images
        env:
          # sponsors の取得には read:user / read:org スコープの PAT が必要。
          # デフォルトの GITHUB_TOKEN では権限が足りない
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
          SPONSORKIT_GITHUB_LOGIN: ${{ vars.SPONSORKIT_GITHUB_LOGIN || 'ysknsid25' }}
        run: pnpm run sponsors

      - name: Commit updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if git diff --staged --quiet; then
            echo 'No sponsor changes.'
          else
            git commit -m 'chore: update sponsor images'
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
